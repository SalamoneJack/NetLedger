# Run NetLedger with Docker Compose.
#   1. netledger init        (or copy the files from src/netledger/templates)
#   2. edit netledger.yaml, inventory.yaml and netledger.env
#   3. docker compose up -d   ->  http://localhost:8080
services:
  netledger:
    image: ghcr.io/salamonejack/netledger:latest
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./netledger.env
    volumes:
      - ./netledger.yaml:/etc/netledger/netledger.yaml:ro
      - ./inventory.yaml:/etc/netledger/inventory.yaml:ro
      - netledger-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  netledger-data:
