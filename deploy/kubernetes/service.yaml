apiVersion: v1
kind: Service
metadata:
  name: netledger
  labels:
    app.kubernetes.io/name: netledger
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: /metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: netledger
  ports:
    - name: http
      port: 8080
      targetPort: http
