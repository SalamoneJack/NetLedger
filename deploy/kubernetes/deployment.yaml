apiVersion: apps/v1
kind: Deployment
metadata:
  name: netledger
  labels:
    app.kubernetes.io/name: netledger
spec:
  replicas: 1                    # the built-in scheduler must run exactly once
  strategy:
    type: Recreate               # never two pods on the same ReadWriteOnce volume
  selector:
    matchLabels:
      app.kubernetes.io/name: netledger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netledger
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: netledger
          image: ghcr.io/salamonejack/netledger:1.0.0
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NETLEDGER_CONFIG
              value: /etc/netledger/netledger.yaml
            - name: NETLEDGER_DATA_DIR
              value: /data
          envFrom:
            - secretRef:
                name: netledger-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/netledger
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: netledger-config
        - name: data
          persistentVolumeClaim:
            claimName: netledger-data
        - name: tmp
          emptyDir: {}
